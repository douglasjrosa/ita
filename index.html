<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estudos ITA</title>
  <meta name="description" content="Material complementar para o vestibular do ITA" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
  />
  <style>
    /* Print: hide Docsify chrome; keep usable A4 margins */
    @media print {
      @page {
        size: A4;
        margin: 10mm;
      }

      html,
      body {
        background: #fff !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .sidebar,
      .sidebar-toggle,
      .search,
      .app-nav,
      .github-corner,
      nav {
        display: none !important;
      }

      main,
      .content,
      .markdown-section {
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
        position: static !important;
      }

      .markdown-section {
        font-size: 11pt;
        line-height: 1.35;
      }

      a[href]::after {
        content: none !important;
      }

      h1,
      h2,
      h3,
      .katex-display,
      table,
      pre,
      img {
        break-inside: avoid;
      }
    }

    /*
      Desktop print: Chrome often ignores @page margins (content flush to edge).
      Add a little content padding on wide viewports only; mobile print stays as-is.
    */
    @media print and (min-width: 768px) {
      @page {
        margin: 14mm;
      }

      .markdown-section {
        padding: 8mm 12mm !important;
        box-sizing: border-box !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: "Estudos ITA",
      loadSidebar: true,
      // true: sibling links (teoria ↔ exercicios) resolve in the day folder.
      // Sidebar keeps root-absolute paths (/README.md, /FASE_1.md, …).
      relativePath: true,
      alias: {
        "/.*/_sidebar.md": "/_sidebar.md",
      },
      homepage: "README.md",
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,
      search: {
        placeholder: "Buscar",
        noData: "Nenhum resultado",
      },
    };
  </script>
  <!-- KaTeX + marked@3 required by docsify-katex (use $...$ and $$...$$) -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@1.4.2/dist/docsify-katex.js"></script>
</body>
</html>
